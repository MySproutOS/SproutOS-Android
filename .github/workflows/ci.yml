name: Android client

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.14.3"
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Prove the signer, not GitHub, owns release signing
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"; then
            echo "release APK was unexpectedly signed in GitHub Actions" >&2
            exit 1
          fi

  # Only an explicit v<versionName> tag creates a signer handoff. Pull-request and ordinary
  # main-branch pushes verify the client but cannot create a production-signing input.
  release-handoff:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      EXPECTED_PACKAGE_NAME: com.sproutos.store
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.14.3"
      - name: Build the unsigned release from a clean tree
        run: gradle clean :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Verify and package the operator handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_TYPE" = "tag"
          tag_name=$GITHUB_REF_NAME
          case "$tag_name" in
            v*) ;;
            *) echo "release tag must be v<versionName>" >&2; exit 1 ;;
          esac
          tag_version=${tag_name#v}
          test -n "$tag_version"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

          source_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$source_apk"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$source_apk"; then
            echo "release APK was unexpectedly signed in GitHub Actions" >&2
            exit 1
          fi

          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$source_apk")
          package_name=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")
          version_code=$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging")
          version_name=$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<<"$badging")
          test "$package_name" = "$EXPECTED_PACKAGE_NAME"
          test -n "$version_code"
          test -n "$version_name"
          test "$tag_version" = "$version_name"
          test "$tag_name" = "v${version_name}"

          artifact="sproutos-store-${version_name}-v${version_code}-unsigned.apk"
          mkdir dist
          cp "$source_apk" "dist/$artifact"
          (cd dist && sha256sum "$artifact" > SHA256SUMS && sha256sum -c SHA256SUMS)
          digest=$(sha256sum "dist/$artifact" | awk '{print $1}')
          size_bytes=$(stat -c '%s' "dist/$artifact")
          python3 - \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$artifact" "$digest" "$size_bytes" \
            "$package_name" "$version_name" "$version_code" "$tag_name" "$GITHUB_REF" \
            > dist/release-manifest.json <<'PY'
          import json
          import sys

          repository, commit, artifact, digest, size, package, version_name, version_code, tag, ref = sys.argv[1:]
          json.dump(
              {
                  "schemaVersion": 1,
                  "sourceRepository": repository,
                  "sourceCommit": commit,
                  "sourceTag": tag,
                  "sourceRef": ref,
                  "artifact": artifact,
                  "sha256": digest,
                  "sizeBytes": int(size),
                  "packageName": package,
                  "versionName": version_name,
                  "versionCode": int(version_code),
                  "signed": False,
              },
              sys.stdout,
              indent=2,
              sort_keys=True,
          )
          sys.stdout.write("\n")
          PY
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg tag "$tag_name" \
            --arg package "$EXPECTED_PACKAGE_NAME" \
            --arg version_name "$version_name" \
            --argjson version_code "$version_code" '
              .sourceRepository == $repository and
              .sourceCommit == $commit and
              .sourceTag == $tag and
              .sourceRef == ("refs/tags/" + $tag) and
              .packageName == $package and
              .versionName == $version_name and
              .versionCode == $version_code and
              .signed == false
            ' dist/release-manifest.json
      - name: Attest the unsigned APK build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.apk
      - name: Upload the immutable operator handoff
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sproutos-android-unsigned-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 90
      - name: Record the immutable artifact
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo '### Android operator handoff'
            echo
            echo "Artifact ID: \`$ARTIFACT_ID\`"
            echo "Archive SHA-256: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
