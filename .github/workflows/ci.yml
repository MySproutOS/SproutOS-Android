name: Android client

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Prove the signer, not GitHub, owns release signing
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"; then
            echo "release APK was unexpectedly signed in GitHub Actions" >&2
            exit 1
          fi
